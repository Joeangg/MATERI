<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineReview - Review Film</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css"/>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#E50914', dark: '#141414', card: '#1f1f1f' } } }
    }
  </script>
</head>
<body class="bg-dark text-white min-h-screen">

  <nav class="bg-black bg-opacity-90 fixed top-0 w-full z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-primary text-2xl font-extrabold tracking-widest">🎬 CineReview</a>
      <ul class="flex space-x-6 text-sm font-semibold">
        <li><a href="index.html" class="hover:text-primary transition">Home</a></li>
        <li><a href="movies.html" class="hover:text-primary transition">Film</a></li>
        <li><a href="review.html" class="text-primary">Review</a></li>
        <li><a href="reservasi.html" class="hover:text-primary transition">Reservasi</a></li>
        <li><a href="about.html" class="hover:text-primary transition">Tentang</a></li>
      </ul>
    </div>
  </nav>

  <div class="pt-28 pb-16 px-6 max-w-4xl mx-auto">
    <h1 class="text-4xl font-extrabold mb-2">Review Film</h1>
    <p class="text-gray-400 mb-10">Tulis dan bagikan ulasanmu tentang film!</p>

    <!-- Form Tambah Review -->
    <div class="bg-card rounded-2xl p-6 mb-10 shadow-lg border border-gray-800">
      <h2 class="text-xl font-bold mb-4 text-primary">✍️ Tulis Review</h2>
      <form id="reviewForm" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Nama Kamu</label>
          <input id="reviewName" type="text" placeholder="Nama lengkap..."
            class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary"/>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Pilih Film</label>
          <select id="reviewMovie" class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary">
            <option value="">-- Pilih Film --</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Rating</label>
          <div id="starRating" class="flex gap-2 text-3xl cursor-pointer">
            <span data-value="1">☆</span>
            <span data-value="2">☆</span>
            <span data-value="3">☆</span>
            <span data-value="4">☆</span>
            <span data-value="5">☆</span>
          </div>
          <input type="hidden" id="reviewRating" value="0"/>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Ulasan</label>
          <textarea id="reviewText" rows="4" placeholder="Tulis ulasanmu di sini..."
            class="w-full bg-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary resize-none"></textarea>
        </div>
        <button type="submit" class="bg-primary hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full transition w-full">
          Kirim Review
        </button>
      </form>
      <div id="reviewMsg" class="mt-4 text-center text-green-400 hidden">✅ Review berhasil dikirim!</div>
    </div>

    <!-- Daftar Review -->
    <h2 class="text-2xl font-bold mb-6 border-l-4 border-primary pl-4">Semua Review</h2>
    <div id="reviewList" class="space-y-6">
      <!-- Diisi JavaScript -->
    </div>
  </div>

  <footer class="bg-black text-gray-500 text-center py-6">
    <p>© 2026 CineReview — Dibuat untuk belajar</p>
  </footer>

  <script src="js/movies.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
